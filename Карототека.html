<!DOCTYPE html>
<html lang="ru" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вет клиника — картотека лошадей</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap">
<style>
:root{--bg:#F3F0FA;--card:#fff;--ink:#2A2438;--mute:#6B6480;--green:#7B68B5;--hay:#C9B8F0;--ok:#2E7D4F;--soon:#B7791F;--bad:#C23B32;--line:#DDD5F0;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181523;--card:#221E33;--ink:#ECE8F7;--mute:#A59FBA;--green:#B7A6EA;--ok:#6FCF97;--soon:#E3B94A;--bad:#FF7A70;--line:#342E4D;--on:#1B1630}}
:root[data-theme="dark"]{--bg:#181523;--card:#221E33;--ink:#ECE8F7;--mute:#A59FBA;--green:#B7A6EA;--ok:#6FCF97;--soon:#E3B94A;--bad:#FF7A70;--line:#342E4D;--on:#1B1630}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:"Zilla Slab",Georgia,serif;margin:0}
header{display:flex;align-items:center;gap:12px;padding:8px 0 16px}
header img{height:72px;width:auto;flex:none}header{background:#7B68B5;color:#fff;border-radius:12px;padding:12px 18px;margin-bottom:16px}header h1{color:#fff}header .sub{color:#EDE8FA}
h1{font-size:28px;line-height:1.1}.sub{color:var(--mute);font-size:14px}
h2{font-size:22px;margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px;max-width:100%}
.card.ok{border-left-color:var(--ok)}.card.soon{border-left-color:var(--soon)}.card.bad{border-left-color:var(--bad)}
.card h3{font-size:20px}.meta{color:var(--mute);font-size:14px;margin:2px 0 8px}
.rec{display:flex;gap:8px;align-items:baseline;font-size:15px;margin:3px 0}
.rec i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ok);transform:translateY(1px)}
.rec.soon i{background:var(--soon)}.rec.bad i{background:var(--bad)}
.note{background:color-mix(in srgb,var(--hay) 22%,transparent);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.f{display:block;margin:0 0 10px}.f span{display:block;font-size:14px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.row{grid-template-columns:1fr}}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;background:var(--green);color:var(--on);cursor:pointer}
button.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}button.danger{background:transparent;color:var(--bad);border:1px solid var(--line);padding:6px 10px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hay);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:8px}.tabs button{background:transparent;color:var(--ink);border:1px solid var(--line)}.tabs button.on{background:var(--green);color:var(--on)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.msg{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;margin:10px 0;user-select:all}
.err{color:var(--bad);font-weight:600;margin:8px 0}.empty{color:var(--mute)}
.small{font-size:13px;color:var(--mute)}
.pick{display:grid;gap:12px;margin-top:8px}.big{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:22px 20px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:12px}.big b{font:700 24px "Zilla Slab",Georgia,serif}.big span{font-weight:400;color:var(--mute)}.warn{background:color-mix(in srgb,var(--hay) 35%,transparent);border-radius:8px;padding:10px 12px;margin:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
</style></head><body><main>

<script id="data" type="application/json">{"owners":[{"nick":"Alpa41no1","key":"alpa41no1","hash":"f21514c76f226d381a6d2d8fb32f30b7db64a2da8beb6c48aecc78b9740ff19d"}],"horses":[{"id":"imuym55qzy31","owner":"alpa41no1","name":"Dixie La Gentry","breed":"Голштинская","age":"9 лет","vacc":"","check":"","notes":""},{"id":"imuym6krt84k","owner":"alpa41no1","name":"Vivienne la Caillie","breed":"Брабансон","age":"7 лет","vacc":"","check":"","notes":""},{"id":"imuym6yrhsf5","owner":"alpa41no1","name":"Opera Noire","breed":"Лузитано","age":"8 лет","vacc":"","check":"","notes":""}],"appts":[]}</script>
<script>
const $=s=>document.querySelector(s);
let D=JSON.parse($('#data').textContent),art=null,canEdit=false,editing=null,draft=null,err='',dirty=false;
const SINGLE=D.single||null;
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
const H=(t,a,...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(n==='class')e.className=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(v!=null&&v!==false)e.setAttribute(n,v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c);return e};
const F=(l,el)=>H('label',{class:'f'},H('span',{},l),el);
const key=n=>n.trim().toLowerCase();
const days=d=>d?Math.floor((Date.now()-new Date(d))/864e5):null;
const fmt=(d,t)=>d?new Date(d).toLocaleString('ru-RU',t?{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}:{day:'numeric',month:'long',year:'numeric'}):'—';
async function hash(n,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(key(n)+':'+p.trim()));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function recs(h){const r=[],v=days(h.vacc),c=days(h.check);
 r.push(v==null?['bad','Нет данных о прививке — запишитесь на вакцинацию']:v>365?['bad','Прививка просрочена — пора на вакцинацию']:v>300?['soon','Скоро пора на прививку']:['ok','Прививка действует']);
 r.push(c==null?['soon','Осмотр ещё не проводился']:c>180?['bad','Давно не было осмотра — пора записаться']:c>150?['soon','Скоро плановый осмотр']:['ok','Осмотр проходил недавно']);return r}
const worst=r=>r.some(x=>x[0]==='bad')?'bad':r.some(x=>x[0]==='soon')?'soon':'ok';
function doc(data,title){const c=document.documentElement.cloneNode(true);c.querySelector('#app').replaceChildren();
 c.querySelector('#data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');if(title)c.querySelector('title').textContent=title;return'<!DOCTYPE html>\n'+c.outerHTML}
function personal(o){return doc({single:o.key,owners:[{nick:o.nick,key:o.key,hash:''}],horses:D.horses.filter(h=>h.owner===o.key),appts:D.appts.filter(a=>a.owner===o.key)},'Вет клиника — '+o.nick)}
async function dl(name,text){
 try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:name,data:text});return}}catch(e){if(e&&e.code==='declined')return}
 const a=H('a',{href:URL.createObjectURL(new Blob([text],{type:'text/html'})),download:name});document.body.append(a);a.click();a.remove()}
const live=()=>art&&canEdit;
async function save(){dirty=true;if(live()){try{await art.publish(doc(D))}catch(e){err='Не удалось сохранить: '+(e.code||e.message)}}render()}
const del=fn=>{const b=H('button',{class:'danger',onclick:()=>{if(b.dataset.a)return fn();b.dataset.a=1;b.textContent='Точно удалить?';setTimeout(()=>{delete b.dataset.a;b.textContent='Удалить'},3000)}},'Удалить');return b};
const back=()=>H('button',{class:'ghost',onclick:()=>{ss.set('role',null);ss.set('vetok',null);render()}},'← На главную');

function card(h){const r=recs(h);return H('div',{class:'card '+worst(r)},
 H('h3',{},h.name),H('div',{class:'meta'},[h.breed,h.age].filter(Boolean).join(', ')),
 H('div',{class:'meta'},'Последняя прививка: '+fmt(h.vacc)+'. Последний осмотр: '+fmt(h.check)+'.'),
 r.map(x=>H('div',{class:'rec '+x[0]},H('i'),x[1])),
 h.notes&&H('div',{class:'note'},H('b',{},'Назначение ветеринара: '),h.notes))}

function playerView(){const k=ss.get('who'),o=D.owners.find(x=>x.key===k);
 if(!o)return loginView();
 const hs=D.horses.filter(h=>h.owner===k),ap=D.appts.filter(a=>a.owner===k).sort((a,b)=>a.when<b.when?-1:1);
 return H('div',{},
  H('div',{class:'bar'},H('h2',{},'Лошади игрока '+o.nick),!SINGLE&&H('button',{class:'ghost',onclick:()=>{ss.set('who',null);ss.set('role',null);render()}},'Выйти')),
  hs.length?hs.map(card):H('p',{class:'empty'},'У вас пока нет лошадей в картотеке. Загляните в клинику — ветеринар внесёт их после первого осмотра.'),
  H('h2',{},'Записи к ветеринару'),
  ap.length?ap.map(a=>H('div',{class:'card ok'},H('b',{},fmt(a.when,1)),H('div',{class:'meta'},(D.horses.find(h=>h.id===a.horse)||{}).name||'Лошадь'),a.note&&H('div',{},a.note))):H('p',{class:'empty'},'Подтверждённых записей нет.'),
  hs.length&&bookForm(o,hs))}

function bookForm(o,hs){const out=H('div'),sel=H('select',{},hs.map(h=>H('option',{value:h.id},h.name))),dt=H('input',{type:'datetime-local'}),cm=H('textarea',{placeholder:'Что беспокоит лошадь, или «плановый осмотр»'});
 return H('div',{class:'card'},H('h3',{},'Записаться на осмотр'),H('div',{class:'meta'},'Выберите удобное время. Ветеринар подтвердит запись и добавит её сюда.'),
  F('Лошадь',sel),F('Желаемые дата и время',dt),F('Комментарий',cm),
  H('button',{onclick:()=>{if(!dt.value){out.replaceChildren(H('div',{class:'err'},'Выберите дату и время'));return}
   const t='Запись к ветеринару\nИгрок: '+o.nick+'\nЛошадь: '+sel.selectedOptions[0].textContent+'\nКогда: '+fmt(dt.value,1)+(cm.value.trim()?'\nКомментарий: '+cm.value.trim():'');
   const cp=H('button',{class:'ghost',onclick:async()=>{try{await navigator.clipboard.writeText(t);cp.textContent='Скопировано'}catch(e){cp.textContent='Выделите текст и скопируйте вручную'}}},'Скопировать');
   out.replaceChildren(H('div',{class:'msg'},t),cp,H('p',{class:'small'},'Отправьте этот текст ветеринару в чат сервера или Discord.'))}},'Составить заявку'),out)}

function loginView(){const n=H('input',{autocomplete:'off',placeholder:'Ваш ник в майнкрафте'}),p=H('input',{type:'password',placeholder:'PIN-код от ветеринара',inputmode:'numeric'}),e=H('div');
 const go=async()=>{const o=D.owners.find(x=>x.key===key(n.value));
  if(o&&o.hash&&o.hash===await hash(n.value,p.value)){ss.set('who',o.key);render()}else e.replaceChildren(H('div',{class:'err'},'Ник или PIN не подошли. PIN выдаёт ветеринар в клинике.'))};
 p.addEventListener('keydown',ev=>{if(ev.key==='Enter')go()});
 return H('div',{class:'card'},H('h2',{style:'margin-top:0'},'Вход для участников'),F('Ник',n),F('PIN-код',p),H('div',{class:'bar'},H('button',{onclick:go},'Показать моих лошадей'),back()),e)}

function vetLogin(){const setup=!D.vetHash,p=H('input',{type:'password',placeholder:setup?'Придумайте пароль (от 4 символов)':'Пароль ветеринара'}),e=H('div');
 const go=async()=>{if(setup){if(p.value.trim().length<4){e.replaceChildren(H('div',{class:'err'},'Пароль слишком короткий'));return}D.vetHash=await hash('vet',p.value);ss.set('vetok','1');await save()}
